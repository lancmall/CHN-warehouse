<style>
:root {
  --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f1f5f9; --card: #ffffff;
  --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --danger: #dc2626;
  --success: #16a34a; --warning: #d97706; --sidebar-w: 240px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; border-radius: 6px; font-size: 14px; padding: 8px 16px; transition: all .15s; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; width: 100%; outline: none; background:#fff; }
select { cursor: pointer; appearance: auto; -webkit-appearance: auto; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-group .opt-btn { padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; transition: all .15s; }
.btn-group .opt-btn:hover { border-color: var(--primary); }
.btn-group .opt-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }

/* ===== 登录页 ===== */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%); }
.login-card { background:#fff; border-radius:16px; padding:40px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.login-card h1 { text-align:center; font-size:22px; margin-bottom:8px; color:var(--primary-dark); }
.login-card .sub { text-align:center; color:var(--text-light); font-size:13px; margin-bottom:28px; }
.login-card .field { margin-bottom:16px; }
.login-card label { display:block; font-size:13px; color:var(--text-light); margin-bottom:4px; }
.login-btn { width:100%; background:var(--primary); color:#fff; padding:11px; font-size:15px; margin-top:8px; }
.login-btn:hover { background:var(--primary-dark); }
.login-error { color:var(--danger); font-size:13px; text-align:center; margin-top:10px; display:none; }

/* ===== 布局 ===== */
.app { display:flex; min-height:100vh; }
.sidebar { width:var(--sidebar-w); background:#1e293b; color:#cbd5e1; flex-shrink:0; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; }
.sidebar .logo { padding:20px 18px; font-size:16px; font-weight:700; color:#fff; border-bottom:1px solid #334155; }
.sidebar .nav { padding:10px 0; }
.sidebar .nav a { display:block; padding:10px 18px; font-size:14px; color:#94a3b8; border-left:3px solid transparent; }
.sidebar .nav a:hover { background:#334155; color:#fff; }
.sidebar .nav a.active { background:#334155; color:#fff; border-left-color:var(--primary); }
.sidebar .nav .section { padding:14px 18px 4px; margin-top:10px; font-size:13px; font-weight:700; color:#e2e8f0; border-top:1px solid #334155; }
.sidebar .nav .section:first-child { border-top:none; margin-top:0; }
.main { margin-left:var(--sidebar-w); flex:1; padding:24px; min-width:0; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.topbar h2 { font-size:20px; }
.topbar .user-info { font-size:13px; color:var(--text-light); }
.topbar .logout-btn { background:#fee2e2; color:var(--danger); }

/* ===== 卡片 ===== */
.card { background:var(--card); border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:16px; }
.card h3 { font-size:15px; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.form-grid { display:flex; flex-direction:column; gap:14px; }
.form-grid .full { grid-column:1/-1; }
.form-group label { display:block; font-size:13px; color:var(--text-light); margin-bottom:4px; }
.form-actions { margin-top:18px; display:flex; gap:10px; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-secondary { background:#e2e8f0; color:var(--text); }
.btn-danger { background:#fee2e2; color:var(--danger); }
.btn-sm { padding:5px 10px; font-size:12px; }

/* ===== 表格 ===== */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#f8fafc; text-align:center; padding:10px 12px; font-weight:600; color:var(--text-light); border-bottom:2px solid var(--border); white-space:nowrap; }
td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text); text-align:center; }
tr:hover td { background:#f8fafc; }
.table-actions { display:flex; gap:6px; justify-content:center; }

/* ===== KPI ===== */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
.kpi-card { background:var(--card); border-radius:10px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.kpi-card .label { font-size:13px; color:var(--text-light); margin-bottom:6px; }
.kpi-card .value { font-size:24px; font-weight:700; }
.kpi-card .value.positive { color:var(--success); }
.kpi-card .value.negative { color:var(--danger); }

.chart-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
@media(max-width:900px){ .chart-row{grid-template-columns:1fr;} .sidebar{width:60px;} .sidebar .logo{font-size:0;} .sidebar .logo::after{content:"E";font-size:18px;} .sidebar .nav a{padding:10px; font-size:0;} .sidebar .nav a::after{content:"≡";font-size:16px;} .main{margin-left:60px;} }

/* ===== 工具条 ===== */
.toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.toolbar input, .toolbar select { width:auto; min-width:120px; }
.toolbar .spacer { flex:1; }

.view { display:none; }
.view.active { display:block; }
.toast { position:fixed; top:20px; right:20px; background:var(--success); color:#fff; padding:12px 20px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.15); z-index:9999; display:none; }
.toast.error { background:var(--danger); }
</style>

<script>
// ============================================================
// 数据层：Supabase 云数据库
// ============================================================
const SUPABASE_URL = 'https://qvwzyhngpqjmuryljdtw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ox7fOMiHrhMzlw1QFyHyFQ_eS60XW3j';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABLES = ['users','workload','shipments','problems','losses','arrivals','fixedcosts','salaries','expenses'];

let db = {
  users: [], workload: [], shipments: [], problems: [], losses: [], arrivals: [],
  fixedcosts: [], salaries: [], expenses: [], seq: 1000,
  countries: ['BD','LK','PK'], productAttrs: ['普通货','带电','化妆品','插线','其他'],
  costCategories: ['房租','水电','物业','设备折旧','耗材','软件/系统','物流运费','办公费用','其他'],
  problemTypes: ['货不对版','质量问题','数量不对','商品破损','其他'],
  responsibleTypes: ['采购','商家','物流','仓库','其他'],
  solutionTypes: ['退货退款','换货','仅退款','其他'],
  tempExpenseCategories: ['国内运费','团建聚餐','接待费用','办公耗材','设备维修','交通费用','其他'],
};

async function loadDB() {
  if (typeof supabase === 'undefined') throw new Error('Supabase SDK未加载');
  // 测试连接
  const { data: testData, error: testErr } = await sb.from('users').select('*').limit(1);
  if (testErr) throw new Error(testErr.message);
  // 加载所有业务表
  for (const t of TABLES) {
    try {
      const { data, error } = await sb.from(t).select('*');
      if (error) { console.warn('loadDB warn:', t, error.message); continue; }
      db[t] = data || [];
    } catch(e) { console.warn('loadDB error:', t, e); }
  }
  // 加载配置
  try {
    const { data: opts, error } = await sb.from('app_options').select('*');
    if (!error && opts) {
      opts.forEach(o => { db[o.key] = o.value; });
    }
  } catch(e) { console.warn('loadDB opts error:', e); }
  // 计算max id
  let maxId = 0;
  TABLES.forEach(t => { (db[t]||[]).forEach(r => { if (r.id > maxId) maxId = r.id; }); });
  db.seq = maxId + 1;
}

async function saveRow(store, obj) {
  // 插入新行到Supabase，返回带id的对象
  const { data, error } = await sb.from(store).insert(obj).select().single();
  if (error) { console.error('saveRow error:', error); toast('保存失败: '+error.message, true); return null; }
  obj.id = data.id;
  if (!db[store]) db[store] = [];
  db[store].push(obj);
  return obj;
}

async function updateRow(store, id, obj) {
  const { error } = await sb.from(store).update(obj).eq('id', id);
  if (error) { console.error('updateRow error:', error); toast('更新失败: '+error.message, true); return false; }
  const idx = (db[store]||[]).findIndex(r => r.id === id);
  if (idx >= 0) db[store][idx] = { ...db[store][idx], ...obj, id };
  return true;
}

async function deleteRow(store, id) {
  const { error } = await sb.from(store).delete().eq('id', id);
  if (error) { console.error('deleteRow error:', error); toast('删除失败: '+error.message, true); return false; }
  db[store] = (db[store]||[]).filter(r => r.id !== id);
  return true;
}

async function saveOption(key, value) {
  const { error } = await sb.from('app_options').upsert({ key, value });
  if (error) console.error('saveOption error:', error);
  db[key] = value;
}

function nextId() { return db.seq++; }
function saveDB() { /* Supabase模式下直接写库，此函数仅兼容旧代码 */ }
function today() { return new Date().toISOString().slice(0,10); }
function nowTime() { return new Date().toTimeString().slice(0,5); }
function monthOf(dateStr) { return (dateStr||'').slice(0,7); }
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' error' : '');
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 2500);
}


function fmtMoney(n) { return '¥' + Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2}); }

// ============================================================
// 认证
// ============================================================
let currentUser = null;
const SESSION_KEY = 'eric_warehouse_session';

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const found = db.users.find(x => x.username === u && x.password === p);
  if (!found) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  document.getElementById('login-error').style.display = 'none';
  currentUser = found;
  localStorage.setItem(SESSION_KEY, JSON.stringify({id: found.id, username: found.username, role: found.role, name: found.name}));
  enterApp();
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  location.hash = '';
  showView('login');
}

function restoreSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (s) {
      const found = db.users.find(x => x.id === s.id);
      if (found) { currentUser = found; return true; }
    }
  } catch(e) {}
  return false;
}

function showView(name) {
  document.getElementById('view-login').style.display = name === 'login' ? 'flex' : 'none';
  if (!currentUser) return;
  // 管理员始终用admin侧边栏；员工用staff侧边栏
  const useAdmin = currentUser.role === 'admin';
  document.getElementById('view-staff').style.display = (useAdmin || name.startsWith('login')) ? 'none' : 'flex';
  document.getElementById('view-admin').style.display = useAdmin ? 'flex' : 'none';
}

// ============================================================
// 路由
// ============================================================
function enterApp() {
  if (currentUser.role === 'admin') {
    document.getElementById('admin-username').textContent = currentUser.name + '（管理员）';
    location.hash = 'admin/dashboard';
  } else {
    document.getElementById('staff-username').textContent = currentUser.name;
    location.hash = 'staff/workload';
  }
  route();
}

window.addEventListener('hashchange', route);
function afterSubmit(adminView) {
  if (currentUser.role === 'admin') {
    location.hash = adminView;
  }
}

function route() {
  const h = location.hash.slice(1) || (currentUser ? (currentUser.role==='admin' ? 'admin/dashboard' : 'staff/workload') : 'login');
  if (!currentUser) { showView('login'); return; }
  showView(h);
  document.querySelectorAll('.sidebar .nav a').forEach(a => a.classList.remove('active'));
  const active = document.querySelector('.sidebar .nav a[data-view="'+h+'"]');
  if (active) active.classList.add('active');
  try {
    if (h.startsWith('staff')) {
      if (currentUser.role === 'admin') {
        document.getElementById('admin-title').textContent = '';
        renderStaffTo(h, document.getElementById('admin-content'));
      } else {
        renderStaff(h);
      }
    } else if (h.startsWith('admin')) {
      renderAdmin(h);
    }
  } catch(e) {
    console.error('路由错误:', e);
    document.getElementById('admin-content').innerHTML = '<div class="card"><h3>页面加载出错</h3><p style="color:#ef4444">'+e.message+'</p><p style="color:#64748b">请刷新页面重试，或回到<a href="#admin/dashboard">仪表盘</a></p></div>';
  }
}

// 管理员在后台框架内渲染员工端内容
function renderStaffTo(view, targetEl) {
  const map = {
    'staff/workload': staffWorkload,
    'staff/shipment': staffShipment,
    'staff/problem': staffProblem,
    'staff/loss': staffLoss,
    'staff/arrival': staffArrival,
    'staff/expense': staffExpense,
    'staff/stats': staffStats,
    'staff/records': staffRecords,
  };
  const fn = map[view] || staffWorkload;
  // 临时把staff-content和staff-title指向admin的元素
  const sc = document.getElementById('staff-content');
  const st = document.getElementById('staff-title');
  const ac = document.getElementById('admin-content');
  const at = document.getElementById('admin-title');
  sc.id = 'staff-content-tmp';
  st.id = 'staff-title-tmp';
  ac.id = 'staff-content';
  at.id = 'staff-title';
  fn();
  // 恢复id
  document.getElementById('staff-content').id = 'admin-content';
  document.getElementById('staff-title').id = 'admin-title';
  document.getElementById('staff-content-tmp').id = 'staff-content';
  document.getElementById('staff-title-tmp').id = 'staff-title';
}

// ============================================================
// 员工端：通用表单渲染
// ============================================================
function formField(label, name, type, val, options, required) {
  let input;
  if (type === 'select') {
    input = `<input type="hidden" name="${name}" value="${val||''}" ${required?'required':''}>`;
    input += `<div class="btn-group" data-name="${name}">`;
    options.forEach(o => {
      input += `<button type="button" class="opt-btn ${val===o?'active':''}" data-value="${o}" onclick="selectOption(this)">${o}</button>`;
    });
    input += `</div>`;
  } else if (type === 'textarea') {
    input = `<textarea name="${name}" rows="2" ${required?'required':''}>${val||''}</textarea>`;
  } else {
    input = `<input type="${type||'text'}" name="${name}" value="${val||''}" ${required?'required':''}>`;
  }
  return `<div class="form-group ${options && options.full ? 'full' : ''}"><label>${label}${required?' *':''}</label>${input}</div>`;
}

function selectOption(btn) {
  const group = btn.parentElement;
  const name = group.dataset.name;
  group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

function renderForm(title, fields, onSubmit) {
  document.getElementById('staff-title').textContent = title;
  const content = document.getElementById('staff-content');
  let html = `<div class="card"><h3>${title}</h3><form id="dataForm"><div class="form-grid">`;
  fields.forEach(f => {
    html += formField(f.label, f.name, f.type, f.val, f.options, f.required);
  });
  html += `</div><div class="form-actions"><button type="submit" class="btn-primary">提交</button><button type="reset" class="btn-secondary">重置</button></div></form></div>`;
  content.innerHTML = html;
  document.getElementById('dataForm').onsubmit = async function(e) {
    e.preventDefault();
    const fd = new FormData(this);
    const obj = {};
    fd.forEach((v,k) => obj[k] = v);
    obj.createdBy = currentUser.name;
    obj.createdAt = new Date().toISOString();
    onSubmit(obj);
    this.reset();
    // 恢复默认日期
    const dInputs = this.querySelectorAll('input[type="date"]');
    dInputs.forEach(d => { if (!d.value) d.value = today(); });
  };
  // 禁止在输入框/下拉框中按回车提交表单（只有textarea允许回车换行）
  document.getElementById('dataForm').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
    }
  });
  // 默认值
  setTimeout(() => {
    const dateInputs = content.querySelectorAll('input[type="date"]');
    dateInputs.forEach(d => { if (!d.value) d.value = today(); });
  }, 0);
}

      const outQty = +fd.get(c+'_out') || 0;

function pickShipCountry(btn) {

function autoBatchNo(country) {
  const d = today().replace(/-/g,'');
  const prefix = country + d;
  const count = (db.shipments||[]).filter(s => (s.batchNo||'').startsWith(prefix)).length;
  const seq = String(count + 1).padStart(2, '0');
  document.getElementById('shipBatchNo').value = prefix + seq;
}

function renderBoxRows() {
  const list = document.getElementById('boxList');
  const attrOptions = db.productAttrs || ['普通货','带电','化妆品','插线','其他'];
  let html = '<table><thead><tr><th>序号</th><th>纸箱条形码</th><th>商品属性</th><th>件数</th><th>重量(kg)</th><th>运输单价</th><th>运费小计</th><th>长×宽×高(cm)</th><th>体积(CBM)</th><th>操作</th></tr></thead><tbody id="boxTbody">';
  shipmentBoxes.forEach((b, i) => {
    const attrOpts = attrOptions.map(a => `<option value="${a}" ${b.attr===a?'selected':''}>${a}</option>`).join('');
    const vol = (b.length && b.width && b.height) ? (b.length*b.width*b.height/1000000).toFixed(4) : '-';
    html += `<tr>
      <td>${i+1}</td>
      <td><input type="text" class="box-barcode" value="${b.barcode}" oninput="shipmentBoxes[${i}].barcode=this.value" style="width:140px" placeholder="扫码或输入"></td>
      <td>
        <select onchange="this.nextElementSibling.style.display=(this.value==='其他')?'inline-block':'none';shipmentBoxes[${i}].attr=this.value;shipmentBoxes[${i}].attrCustom=(this.value==='其他')?this.nextElementSibling.value:'';renderBoxRows();calcShipFreight()" style="width:90px">${attrOpts}</select>
        <input type="text" placeholder="填写其他" oninput="shipmentBoxes[${i}].attrCustom=this.value;calcShipFreight()" style="width:80px;display:${b.attr==='其他'?'inline-block':'none'};margin-left:4px">
      </td>
      <td><input type="number" value="${b.items}" oninput="shipmentBoxes[${i}].items=this.value;calcShipFreight()" style="width:70px"></td>
      <td><input type="number" step="0.01" value="${b.weight}" oninput="shipmentBoxes[${i}].weight=this.value;updateBoxCalc(${i});calcShipFreight()" style="width:80px"></td>
      <td><input type="number" step="0.01" value="${b.rate}" oninput="shipmentBoxes[${i}].rate=this.value;updateBoxCalc(${i});calcShipFreight()" style="width:80px" placeholder="如45"></td>
      <td id="freight-${i}" style="font-weight:600;color:var(--primary)">${((+b.weight||0)*(+b.rate||0)).toFixed(2)}</td>
      <td style="white-space:nowrap">
        <input type="number" value="${b.length}" oninput="shipmentBoxes[${i}].length=this.value;updateBoxCalc(${i});calcShipFreight()" style="width:50px" placeholder="长">×
        <input type="number" value="${b.width}" oninput="shipmentBoxes[${i}].width=this.value;updateBoxCalc(${i});calcShipFreight()" style="width:50px" placeholder="宽">×
        <input type="number" value="${b.height}" oninput="shipmentBoxes[${i}].height=this.value;updateBoxCalc(${i});calcShipFreight()" style="width:50px" placeholder="高">
      </td>
      <td id="vol-${i}" style="font-weight:600">${vol}</td>
      <td><button class="btn-danger btn-sm" onclick="removeBoxRow(${i})">删</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;

  // 扫码枪输入后自动聚焦下一行条形码
  const barcodes = list.querySelectorAll('.box-barcode');
  barcodes.forEach((inp, i) => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (i < barcodes.length - 1) {
          barcodes[i+1].focus();
        } else {
          addBoxRow();
          setTimeout(() => {
            const all = document.querySelectorAll('.box-barcode');
            if (all.length > i+1) all[i+1].focus();
          }, 50);
        }
      }
    });
  });
  calcShipFreight();
}

function updateVol(i) {
  const b = shipmentBoxes[i];
  const el = document.getElementById('vol-' + i);
  if (!el) return;
  const vol = (b.length && b.width && b.height) ? (b.length*b.width*b.height/1000000).toFixed(4) : '-';
  el.textContent = vol;
}

function updateBoxCalc(i) {
  const b = shipmentBoxes[i];
  const volEl = document.getElementById('vol-' + i);
  if (volEl) {
    const vol = (b.length && b.width && b.height) ? (b.length*b.width*b.height/1000000).toFixed(4) : '-';
    volEl.textContent = vol;
  }
  const fEl = document.getElementById('freight-' + i);
  if (fEl) fEl.textContent = ((+b.weight||0)*(+b.rate||0)).toFixed(2);
}

function addBoxRow() {
  shipmentBoxes.push({ barcode:'', items:'', weight:'', length:'', width:'', height:'', attr:'普通货', rate:'' });
  renderBoxRows();
}

function removeBoxRow(i) {
  shipmentBoxes.splice(i, 1);
  renderBoxRows();
  calcShipFreight();
}

function calcShipFreight() {
  const totalWeight = shipmentBoxes.reduce((s,b) => s + (+b.weight||0), 0);
  const totalVol = shipmentBoxes.reduce((s,b) => {
    return s + ((b.length && b.width && b.height) ? (+b.length*+b.width*+b.height/1000000) : 0);
  }, 0);
  const freight = shipmentBoxes.reduce((s,b) => s + (+b.weight||0) * (+b.rate||0), 0);
  document.getElementById('shipTotalWeight').value = totalWeight.toFixed(2) + ' kg';
  document.getElementById('shipFreight').value = '¥' + freight.toFixed(2);

  // 按商品属性分类汇总
  const attrMap = {};
  shipmentBoxes.forEach(b => {
    const attr = b.attr === '其他' ? ('其他:' + (b.attrCustom||'')) : (b.attr || '普通货');
    if (!attrMap[attr]) attrMap[attr] = {weight:0, vol:0, freight:0, items:0};
    attrMap[attr].weight += +b.weight||0;
    attrMap[attr].vol += (b.length && b.width && b.height) ? (+b.length*+b.width*+b.height/1000000) : 0;
    attrMap[attr].freight += (+b.weight||0) * (+b.rate||0);
    attrMap[attr].items += +b.items||0;
  });
  let html = '<table><thead><tr><th>商品属性</th><th>件数</th><th>重量(kg)</th><th>体积(CBM)</th><th>运费(元)</th></tr></thead><tbody>';
  Object.entries(attrMap).forEach(([attr, d]) => {
    html += `<tr><td>${attr}</td><td>${d.items}</td><td>${d.weight.toFixed(2)}</td><td>${d.vol.toFixed(4)}</td><td>¥${d.freight.toFixed(2)}</td></tr>`;
  });
  html += `<tr style="font-weight:700;background:#f8fafc"><td>合计</td><td>${shipmentBoxes.reduce((s,b)=>s+(+b.items||0),0)}</td><td>${totalWeight.toFixed(2)}</td><td>${totalVol.toFixed(4)}</td><td>¥${freight.toFixed(2)}</td></tr>`;
  html += '</tbody></table>';
  const summaryEl = document.getElementById('attrSummary');
  if (summaryEl) summaryEl.innerHTML = html;
}

async function submitShipment() {
  const country = document.getElementById('shipCountry').value;
  const batchNo = document.getElementById('shipBatchNo').value;
  const date = document.getElementById('shipDate').value;
  const logistics = document.getElementById('shipLogistics').value.trim();
  const remark = document.getElementById('shipRemark').value.trim();

  if (!country) { toast('请选择目的国家', true); return; }
  if (!logistics) { toast('请填写物流公司', true); return; }
  const validBoxes = shipmentBoxes.filter(b => b.barcode || b.items || b.weight);
  if (validBoxes.length === 0) { toast('请至少添加一个纸箱', true); return; }

  const totalWeight = validBoxes.reduce((s,b) => s + (+b.weight||0), 0);
  const totalItems = validBoxes.reduce((s,b) => s + (+b.items||0), 0);
  const freight = validBoxes.reduce((s,b) => s + (+b.weight||0) * (+b.rate||0), 0);
  const staff = currentUser.name;

  for (let i = 0; i < validBoxes.length; i++) {
    const b = validBoxes[i];
    const vol = (b.length && b.width && b.height) ? (b.length*b.width*b.height/1000000).toFixed(4) : 0;
    await saveRow('shipments', {
      batchNo, country, date, staff,
      barcode: b.barcode,
      attr: b.attr === '其他' ? ('其他:' + (b.attrCustom||'')) : (b.attr || '普通货'),
      items: +b.items||0,
      weight: +b.weight||0,
      rate: +b.rate||0,
      length: +b.length||0, width: +b.width||0, height: +b.height||0,
      volume: vol,
      logistics,
      freight: i===0 ? freight : 0,
      remark: i===0 ? remark : '',
      boxCount: validBoxes.length,
      totalWeight, totalItems,
      createdAt: new Date().toISOString()
    });
  }
  toast(`批次 ${batchNo} 已提交：${validBoxes.length}个纸箱，${totalItems}件，${totalWeight.toFixed(2)}kg，运费¥${freight.toFixed(2)}`);
  if (currentUser.role === 'admin') { location.hash = '#admin/shipment'; } else { staffShipment(); }
}

let matchedShipment = null;

function lookupShipment() {
  const bc = document.getElementById('arrBarcode').value.trim();
  if (!bc) { toast('请输入纸箱条形码', true); return; }
  // 每个纸箱是一条独立发货记录，barcode直接在记录上
  const found = (db.shipments||[]).find(s => s.barcode === bc);
  if (!found) {
    toast('⚠️ 此条形码未在发货记录中找到，请检查后重新输入', true);
    document.getElementById('arrMatchedInfo').style.display = 'none';
    document.getElementById('arrCountry').value = '';
    document.getElementById('arrLogistics').value = '';
    document.getElementById('arrTotalItems').value = '';
    document.getElementById('arrFreight').value = '';
    matchedShipment = null;
    document.getElementById('arrBarcode').focus();
    document.getElementById('arrBarcode').select();
    return;
  }
  matchedShipment = found;
  document.getElementById('arrCountry').value = found.country || '';
  document.getElementById('arrLogistics').value = found.logistics || '';
  document.getElementById('arrTotalItems').value = found.totalItems || found.items || 0;
  document.getElementById('arrFreight').value = '¥' + (found.freight||0).toFixed(2);
  document.getElementById('arrActualItems').value = found.totalItems || found.items || 0;
  document.getElementById('arrMatchedInfo').style.display = 'block';
  document.getElementById('arrInfoText').innerHTML =
    `批次号：<b>${found.batchNo||'-'}</b> ｜ 国家：<b>${found.country||'-'}</b> ｜ 物流公司：<b>${found.logistics||'-'}</b><br>` +
    `本箱条码：<b>${bc}</b> ｜ 本箱件数：<b>${found.items||0}</b> ｜ 本箱重量：<b>${found.weight||0}kg</b><br>` +
    `整批总件数：<b>${found.totalItems||found.items||0}</b> ｜ 整批总重量：<b>${found.totalWeight||found.weight||0}kg</b> ｜ 总运费：<b>¥${(found.freight||0).toFixed(2)}</b>`;
}

function pickClaimParty(btn) {
  document.querySelectorAll('#claimPartyBtns .opt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('arrClaimParty').value = btn.dataset.value;
}

function calcArrivalStatus() {
  const total = +document.getElementById('arrTotalItems').value || 0;
  // 自动算丢件数 = 总件数 - 实际到货 - 破损
  const actual = +document.getElementById('arrActualItems').value || 0;
  const damaged = +document.getElementById('arrDamagedQty').value || 0;
  if (total > 0) {
    const lost = total - actual - damaged;
    if (lost >= 0) document.getElementById('arrLostQty').value = lost;
  }
}

async function submitArrival() {
  if (!matchedShipment) { toast('请先扫描纸箱条码匹配发货记录', true); return; }
  const claimParty = document.getElementById('arrClaimParty').value;
  if (!claimParty) { toast('请选择赔付方', true); return; }

  const obj = {
    date: document.getElementById('arrDate').value,
    batchNo: matchedShipment.batchNo,
    barcode: document.getElementById('arrBarcode').value.trim(),
    origin: '中国',
    country: matchedShipment.country,
    logistics: matchedShipment.logistics,
    trackingNo: document.getElementById('arrTracking').value.trim(),
    totalItems: matchedShipment.totalItems || matchedShipment.items || 0,
    actualItems: +document.getElementById('arrActualItems').value || 0,
    lostQty: +document.getElementById('arrLostQty').value || 0,
    lostValue: +document.getElementById('arrLostValue').value || 0,
    damagedQty: +document.getElementById('arrDamagedQty').value || 0,
    damagedValue: +document.getElementById('arrDamagedValue').value || 0,
    claimParty,
    freight: matchedShipment.freight || 0,
    remark: document.getElementById('arrRemark').value.trim(),
    staff: currentUser.name,
  };
  obj.intactItems = obj.actualItems - obj.lostQty - obj.damagedQty;
  await saveRow('arrivals', obj);
  toast('到货记录已提交');
  if (currentUser.role === 'admin') { location.hash = '#admin/arrival'; } else { staffArrival(); }
}

function staffStats() {
  document.getElementById('staff-title').textContent = '工作量排行榜';
  const curMonth = today().slice(0,7);
  const curDate = today();
  const mode = window.statsMode || 'month';
  const month = window.statsMonth || curMonth;
  const date = window.statsDate || curDate;
  const weekStart = window.statsWeekStart || getWeekStart(curDate);

  let rows, periodLabel;
  if (mode === 'day') {
    rows = (db.workload||[]).filter(r => r.date === date);
    periodLabel = date;
  } else if (mode === 'week') {
    rows = (db.workload||[]).filter(r => r.date >= weekStart && r.date <= curDate);
    periodLabel = weekStart + ' ~ ' + curDate;
  } else {
    rows = (db.workload||[]).filter(r => (r.date||'').startsWith(month));
    periodLabel = month;
  }

  const byUser = {};
  rows.forEach(r => {
    const n = r.staff || r.name || r.createdBy || '未知';
    if (!byUser[n]) byUser[n] = { in:0, out:0, pack:0, ship:0 };
    byUser[n].in  += +r.inQty  || 0;
    byUser[n].out += +r.outQty || 0;
    byUser[n].pack+= +r.packQty|| 0;
    byUser[n].ship+= +r.shipQty|| 0;
  });

  let arr = Object.entries(byUser).map(([name, v]) => ({
    name, ...v, items: Math.floor((v.in + v.out + v.pack) / 3)
  }));
  arr.sort((a,b) => b.items - a.items);

  const modeBtn = (m, label) => `<button class="btn-sm ${mode===m?'btn-primary':'btn-secondary'}" onclick="window.statsMode='${m}';staffStats()">${label}</button>`;

  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <h3 style="margin:0">工作量排行</h3>
      <div style="display:flex;gap:6px;align-items:center">
        ${modeBtn('day','按日')}${modeBtn('week','按周')}${modeBtn('month','按月')}
        ${mode==='day' ? `<input type="date" value="${date}" onchange="window.statsDate=this.value;staffStats()" style="width:150px">` : ''}
        ${mode==='week' ? `<input type="date" value="${weekStart}" onchange="window.statsWeekStart=this.value;staffStats()" style="width:150px">` : ''}
        ${mode==='month' ? `<input type="month" value="${month}" onchange="window.statsMonth=this.value;staffStats()" style="width:150px">` : ''}
      </div>
    </div>`;

  if (arr.length === 0) {
    html += `<p style="color:var(--text-light)">${periodLabel} 暂无工作量记录</p></div>`;
    document.getElementById('staff-content').innerHTML = html;
    return;
  }

  const medals = ['🥇','🥈','🥉'];
  html += `<p style="margin-bottom:10px;color:var(--text-light);font-size:13px">统计区间：${periodLabel}（3个操作=1件）</p>`;
  html += `<div class="table-wrap"><table>
    <thead><tr><th>排名</th><th>姓名</th><th>入库</th><th>出库</th><th>打包</th><th>商品件数</th><th>对应收入</th></tr></thead><tbody>`;
  arr.forEach((u, i) => {
    const isMe = u.name === currentUser.name;
    const rank = i < 3 ? medals[i] : (i+1);
    html += `<tr style="${isMe?'background:#eef2ff;font-weight:600':''}">
      <td style="font-size:18px">${rank}</td>
      <td>${u.name}${isMe?'（我）':''}</td>
      <td>${u.in}</td><td>${u.out}</td><td>${u.pack}</td>
      <td style="font-weight:700">${u.items}</td>
      <td>¥${(u.items*5).toFixed(0)}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;

  const grand = arr.reduce((s,u) => s+u.items, 0);
  html += `<div class="card" style="margin-top:14px">
    <h3 style="margin-bottom:10px">区间汇总</h3>
    <p style="margin:0;color:var(--text-light)">全员共处理 <b style="color:var(--text)">${grand}</b> 件 · 对应收入 <b style="color:var(--text)">¥${(grand*5).toFixed(0)}</b> · 参与人数 <b style="color:var(--text)">${arr.length}</b> 人</p>
  </div>`;

  document.getElementById('staff-content').innerHTML = html;
}

function getWeekStart(d) {
  const date = new Date(d);
  const day = date.getDay() || 7;
  date.setDate(date.getDate() - day + 1);
  return date.toISOString().slice(0,10);
}

  };

}

function copyText(text, btn) {
  const doCopy = () => {
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '已复制 ✓';
      btn.style.background = '#10b981';
      btn.style.color = '#fff';
      setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 2000);
    }
    toast('已复制：' + text);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(doCopy).catch(() => fallbackCopy(text, doCopy));
  } else {
    fallbackCopy(text, doCopy);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  cb();
}

    if (k === 'orderNo' || k === 'cmCode' || k === 'productUrl' || k === 'batchNo' || k === 'barcode' || k === 'trackingNo') {

    }

      display = `<a href="${v}" target="_blank" style="color:var(--primary);word-break:break-all">${v}</a>`;

async function cycleStatus(id, store, span) {
  const r = db[store].find(x => x.id === id);
  if (!r) return;
  const opts = ['待处理','处理中','已处理','已关闭'];
  const cur = opts.indexOf(r.status);
  const next = opts[(cur + 1) % opts.length];
  r.status = next;
  await updateRow('problems', r.id, {status: next});
  span.innerHTML = statusBadge(next);
  toast('状态已改为：' + next);
}

      if (c === 'status') {
        const cur = r.status || '待处理';
        val = `<span onclick="cycleStatus(${r.id},'${store}',this)" style="cursor:pointer" title="点击修改">${statusBadge(cur)}</span>`;
      }
      if (c === 'orderNo' || c === 'cmCode' || c === 'barcode') {
        val = `${val} <button class="btn-secondary btn-sm" onclick='event.stopPropagation();copyText(this.dataset.v,this)' data-v="${String(val).replace(/"/g,'&quot;')}" style="padding:1px 8px;font-size:11px">复制</button>`;
      }
      html += `<td>${val}</td>`;
    });
    html += `<td class="table-actions"><button class="btn-secondary btn-sm" onclick="detailRecord(${r.id},'${store}')">详情</button>
      <button class="btn-secondary btn-sm" onclick="editRecord(${r.id},'${store}','${cfg.title}')">编辑</button>`;
    html += `<button class="btn-danger btn-sm" onclick="delRecord(${r.id},'${store}')">删除</button></td></tr>`;
  });
  tbody.innerHTML = html || '<tr><td colspan="99" style="text-align:center;color:#999">暂无数据</td></tr>';
}

function filterTable(store, view) {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const monthVal = (document.getElementById('monthFilter')||{}).value || '';
  const catVal = (document.getElementById('catFilter')||{}).value || '';
  const catField = (document.getElementById('catFilter')||{}).dataset.field || '';
  const cfg = TABLE_CONFIGS[view];
  const records = (db[store]||[]).filter(r => {
    if (monthVal) {
      const dateField = r.month || r.date || '';
      if (!String(dateField).startsWith(monthVal)) return false;
    }
    if (catVal && catField) {
      if (r[catField] !== catVal) return false;
    }
    return Object.values(r).some(v => String(v).toLowerCase().includes(q));
  });
  renderTableBody(store, records, cfg);
}

function addRecord(store, view) {
  const cfg = TABLE_CONFIGS[view];
  const cols = cfg.cols;
  let fieldsHtml = '';
  cols.forEach(c => {
    if (c === 'id') return;
    const label = cfg.colLabels[c] || c;
    let val = '';
    if (c === 'date' || c === 'month') val = (c==='month') ? today().slice(0,7) : today();
    if (cfg.selectFields && cfg.selectFields[c]) {
      const fieldDef = cfg.selectFields[c];
      const opts = Array.isArray(fieldDef) ? fieldDef : (db[fieldDef] || []);
      let html = `<div class="form-group" style="margin-bottom:14px"><label>${label}</label>`;
      html += `<input type="hidden" name="${c}" value="${val}">`;
      html += `<div class="btn-group" data-name="${c}">`;
      opts.forEach(o => {
        html += `<button type="button" class="opt-btn ${val===o?'active':''}" data-value="${o}" onclick="selectOption(this)">${o}</button>`;
      });
      html += `</div></div>`;
      fieldsHtml += html;
    } else {
      fieldsHtml += `<div class="form-group" style="margin-bottom:10px"><label>${label}</label><input name="${c}" value="${val}"></div>`;
    }
  });
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<div class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center">
    <div class="card" style="width:500px;max-height:80vh;overflow-y:auto">
    <h3>新增 - ${cfg.title}</h3>${fieldsHtml}
    <div class="form-actions"><button class="btn-primary" onclick="saveRecord(${Date.now()},'${store}',true)">保存</button>
    <button class="btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">取消</button></div>
    </div></div>`;
  document.body.appendChild(wrapper);
}

function editRecord(id, store, title) {
  const rec = (db[store]||[]).find(r => r.id === id);
  if (!rec) return;
  const cfg = Object.values(TABLE_CONFIGS).find(c => c.title === title);
  const cols = cfg.cols.filter(c => c !== 'id');
  let fieldsHtml = '';
  cols.forEach(c => {
    const label = cfg.colLabels[c] || c;
    const val = rec[c] ?? '';
    if (c === 'status') {
      const opts = ['待处理','处理中','已处理','已关闭'];
      fieldsHtml += `<div class="form-group" style="margin-bottom:14px"><label>${label}</label>`;
      fieldsHtml += `<input type="hidden" name="status" value="${val}">`;
      fieldsHtml += `<div class="btn-group" data-name="status">`;
      opts.forEach(o => {
        fieldsHtml += `<button type="button" class="opt-btn ${val===o?'active':''}" data-value="${o}" onclick="selectOption(this)">${o}</button>`;
      });
      fieldsHtml += `</div></div>`;
    } else if (cfg.selectFields && cfg.selectFields[c]) {
      const fieldDef = cfg.selectFields[c];
      const opts = Array.isArray(fieldDef) ? fieldDef : (db[fieldDef] || []);
      let html = `<div class="form-group" style="margin-bottom:14px"><label>${label}</label>`;
      html += `<input type="hidden" name="${c}" value="${val}">`;
      html += `<div class="btn-group" data-name="${c}">`;
      opts.forEach(o => {
        html += `<button type="button" class="opt-btn ${val===o?'active':''}" data-value="${o}" onclick="selectOption(this)">${o}</button>`;
      });
      html += `</div></div>`;
      fieldsHtml += html;
    } else {
      fieldsHtml += `<div class="form-group" style="margin-bottom:10px"><label>${label}</label><input name="${c}" value="${val}"></div>`;
    }
  });
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<div class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center">
    <div class="card" style="width:500px;max-height:80vh;overflow-y:auto">
    <h3>编辑 - ${title}</h3>${fieldsHtml}
    <div class="form-actions"><button class="btn-primary" onclick="saveRecord(${id},'${store}',false)">保存</button>
    <button class="btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">取消</button></div>
    </div></div>`;
  document.body.appendChild(wrapper);
}

async function saveRecord(id, store, isNew) {
  const overlay = document.querySelector('.modal-overlay');
  const inputs = overlay.querySelectorAll('input');
  const obj = {};
  inputs.forEach(inp => { if (inp.name) obj[inp.name] = inp.value; });
  if (isNew) {
    obj.id = nextId();
    obj.createdBy = currentUser.name;
    obj.createdAt = new Date().toISOString();
    await saveRow(store, obj);
  } else {
    await updateRow(store, id, obj);
  }
  document.querySelector('.modal-overlay').remove();
  toast('保存成功');
  route();
}

async function delRecord(id, store) {
  if (!confirm('确认删除这条记录？')) return;
  await deleteRow(store, id);
  toast('已删除');
  route();
}

function adminDashboard() {
  document.getElementById('admin-title').textContent = '经营状况总览';
  const nowMonth = today().slice(0,7);
  const month = window.dashMonth || nowMonth;

  const mw = db.workload.filter(r => (r.date||'').slice(0,7) === month);
  const ms = db.shipments.filter(r => (r.date||'').slice(0,7) === month);
  const mp = db.problems.filter(r => (r.date||'').slice(0,7) === month);
  const ml = db.losses.filter(r => (r.date||'').slice(0,7) === month);
  const ma = db.arrivals.filter(r => (r.date||'').slice(0,7) === month);
  const mfc = db.fixedcosts.filter(r => r.month === month);
  const msal = db.salaries.filter(r => r.month === month);

  const totalIn = mw.reduce((s,r)=>s+Number(r.inQty||0),0);
  const totalOut = mw.reduce((s,r)=>s+Number(r.outQty||0),0);
  const totalPack = mw.reduce((s,r)=>s+Number(r.packQty||0),0);
  const totalShip = ms.reduce((s,r)=>s+Number(r.items||0),0);
  const revenue = totalShip * 5;
  const fixedCost = mfc.reduce((s,r)=>s+Number(r.amount||0),0);
  const totalSalary = msal.reduce((s,r)=>s+Number(r.netSalary||(Number(r.baseSalary||0)+Number(r.bonus||0)+Number(r.allowance||0)-Number(r.deduction||0))),0);
  const problemCostTotal = mp.reduce((s,r)=>s+Number(r.cost||0),0);
  const isOurWarehouse = v => v === '仓库' || v === '中国仓库' || v === '仓库操作失误';
  const problemCostOur = mp.filter(r=>isOurWarehouse(r.responsible)).reduce((s,r)=>s+Number(r.cost||0),0);
  const lossCostTotal = ml.reduce((s,r)=>s+Number(r.lossAmount||0),0);
  const arrivalLossTotal = ma.reduce((s,r)=>s+Number(r.lostValue||0)+Number(r.damagedValue||0),0);
  const arrivalLossOur = ma.filter(r=>isOurWarehouse(r.claimParty)).reduce((s,r)=>s+Number(r.lostValue||0)+Number(r.damagedValue||0),0);
  const totalLossTotal = problemCostTotal + lossCostTotal + arrivalLossTotal;
  const totalLossOur = problemCostOur + lossCostTotal + arrivalLossOur; // 仓库丢失算自己的
  const totalCost = fixedCost + totalSalary + totalLossOur; // 只把中国仓库损失算进成本
  const profit = revenue - totalCost;

  // 人效计算：3个操作(入库+出库+打包)=1件商品
  const effByUser = {};
  mw.forEach(r => {
    const name = r.staff || r.createdBy || r.name || '未知';
    if (!effByUser[name]) effByUser[name] = {ops:0, days:0, hours:0};
    effByUser[name].ops += Number(r.inQty||0)+Number(r.outQty||0)+Number(r.packQty||0);
    effByUser[name].days += 1;
    if (r.startTime && r.endTime) {
      const [sh,sm] = r.startTime.split(':').map(Number);
      const [eh,em] = r.endTime.split(':').map(Number);
      effByUser[name].hours += (eh+em/60) - (sh+sm/60);
    }
  });
  const teamOps = Object.values(effByUser).reduce((s,d)=>s+d.ops,0);
  const teamItems = teamOps / 3; // 3个操作=1件

  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="margin:0">${month} 经营概览</h3>

    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi-card"><div class="label">发货件数</div><div class="value">${totalShip}</div></div>

      <div class="kpi-card"><div class="label">总成本</div><div class="value negative">${fmtMoney(totalCost)}</div></div>
      <div class="kpi-card"><div class="label">盈亏</div><div class="value ${profit>=0?'positive':'negative'}">${fmtMoney(profit)}</div></div>
    </div>
  </div>`;

  // 损失明细 + 饼图
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="card"><h3>损失明细（${month}）</h3>
      <div class="table-wrap"><table>
        <tr><td>问题件损失（总）</td><td>${mp.length} 件 · ${fmtMoney(problemCostTotal)}</td></tr>
        <tr><td>其中：中国仓库责任</td><td>${fmtMoney(problemCostOur)}</td></tr>
        <tr><td>仓库丢失损失</td><td>${ml.length} 笔 · ${fmtMoney(lossCostTotal)}</td></tr>
        <tr><td>国际物流损失（总）</td><td>${ma.length} 批 · ${fmtMoney(arrivalLossTotal)}</td></tr>
        <tr><td>其中：中国仓库责任</td><td>${fmtMoney(arrivalLossOur)}</td></tr>
        <tr style="background:#fef3c7"><td><b>中国仓库承担合计</b></td><td><b>${fmtMoney(totalLossOur)}</b></td></tr>
        <tr><td>全部损失合计（含其他责任方）</td><td><b>${fmtMoney(totalLossTotal)}</b></td></tr>
      </table></div>
    </div>
    <div class="card"><h3>损失占比</h3><canvas id="lossPie" height="200"></canvas></div>
  </div>`;

  // 人效分析（整行宽幅）
  const salaryByName = {};
  msal.forEach(s => { salaryByName[s.name] = +s.netSalary || (+s.baseSalary||0)+(+s.bonus||0)+(+s.allowance||0)-(+s.deduction||0); });
  html += `<div class="card">
    <h3>人效分析（${month}）</h3>
    <p style="font-size:12px;color:var(--text-light);margin-bottom:10px">规则：入库+出库+打包每3个操作=1件商品；每件收入5元</p>
    <div class="table-wrap"><table style="text-align:center">
      <tr><th style="text-align:center">员工</th><th style="text-align:center">总操作数</th><th style="text-align:center">商品件数</th><th style="text-align:center">出勤天数</th><th style="text-align:center">工时(h)</th><th style="text-align:center">日均件数</th><th style="text-align:center">月工资(元)</th><th style="text-align:center">每件工资成本</th></tr>`;
  Object.entries(effByUser).forEach(([name,d]) => {
    const items = Math.round(d.ops/3);
    const perDay = d.days > 0 ? Math.round(items/d.days) : '-';
    const sal = salaryByName[name] || 0;
    const perItem = items > 0 ? '¥' + (sal/items).toFixed(2) : '-';
    html += `<tr><td style="text-align:center">${name}</td><td style="text-align:center">${d.ops}</td><td style="text-align:center">${items}</td><td style="text-align:center">${d.days}</td><td style="text-align:center">${d.hours ? d.hours.toFixed(1) : '-'}</td><td style="text-align:center"><b>${perDay}</b></td><td style="text-align:center">${sal ? '¥'+sal.toLocaleString() : '-'}</td><td style="text-align:center"><b>${perItem}</b></td></tr>`;
  });
  if (Object.keys(effByUser).length === 0) html += '<tr><td colspan="8" style="color:var(--text-light)">本月暂无工作量数据</td></tr>';
  html += `</table></div></div>`;

  // 人效月度趋势
  html += `<div class="card"><h3>团队人效月度趋势（人均日处理件数）</h3><canvas id="effTrendChart" height="90"></canvas></div>`;
  html += `<div class="card"><h3>近6个月盈亏趋势</h3><canvas id="trendChart" height="90"></canvas></div>`;

  document.getElementById('admin-content').innerHTML = html;

  // 人效月度趋势图
  setTimeout(() => {
    // 损失占比饼图（中国仓库承担部分），3类全显示
    const lossData = [problemCostOur, lossCostTotal, arrivalLossOur];
    const lossLabels = ['问题件(仓库责任)', '仓库丢失', '国际物流(仓库责任)'];
    if (window.lossChart) window.lossChart.destroy();
    window.lossChart = safeChart(document.getElementById('lossPie'), {
      type: 'doughnut',
      data: { labels: lossLabels, datasets: [{ data: lossData, backgroundColor: ['#f59e0b','#ef4444','#8b5cf6'] }] },
      plugins: [{
        id: 'centerText',
        afterDraw: function(chart) {
          const total = lossData.reduce((a,b)=>a+b,0);
          const ctx = chart.ctx;
          const cx = chart.chartArea.left + (chart.chartArea.right - chart.chartArea.left)/2;
          const cy = chart.chartArea.top + (chart.chartArea.bottom - chart.chartArea.top)/2;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillStyle = '#1e293b';
          ctx.fillText('¥' + total.toLocaleString(), cx, cy - 10);
          ctx.font = '12px sans-serif';
          ctx.fillStyle = '#64748b';
          ctx.fillText('仓库总损失', cx, cy + 12);
          ctx.restore();
        }
      }],
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              generateLabels: function(chart) {
                const data = chart.data;
                const total = data.datasets[0].data.reduce((a,b)=>a+b,0);
                return data.labels.map((label, i) => {
                  const val = data.datasets[0].data[i];
                  const pct = total > 0 ? (val/total*100).toFixed(1) : 0;
                  return {
                    text: `${label}: ¥${val.toLocaleString()} (${pct}%)`,
                    fillStyle: data.datasets[0].backgroundColor[i],
                    strokeStyle: data.datasets[0].backgroundColor[i],
                    hidden: false, index: i
                  };
                });
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
                const pct = total > 0 ? (ctx.parsed/total*100).toFixed(1) : 0;
                return ctx.label + ': ¥' + ctx.parsed.toLocaleString() + ' (' + pct + '%)';
              }
            }
          }
        }
      }
    });
    const r2 = new Date();
    const months = [];
    const effData = [];
    const revData = [], expData = [];
    for (let i=5; i>=0; i--) {
      const d = new Date(r2.getFullYear(), r2.getMonth()-i, 1);
      const mk = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      months.push(mk);
      const w = db.workload.filter(x => (x.date||'').slice(0,7)===mk);
      let ops=0, days=0;
      w.forEach(r => {
        ops += Number(r.inQty||0)+Number(r.outQty||0)+Number(r.packQty||0);
        days += 1;
      });
      effData.push(days>0 ? Math.round(ops/3/days) : 0);
      const s = db.shipments.filter(x => (x.date||'').slice(0,7)===mk);
      const ship = s.reduce((t,r)=>t+Number(r.items||0),0);
      revData.push(ship*5);
      const fc = db.fixedcosts.filter(x=>x.month===mk).reduce((t,r)=>t+Number(r.amount||0),0);
      const sal = db.salaries.filter(x=>x.month===mk).reduce((t,r)=>t+Number(r.netSalary||0),0);
      expData.push(fc+sal);
    }
    if (window.effChart) window.effChart.destroy();
    window.effChart = safeChart(document.getElementById('effTrendChart'), {
      type: 'line',
      data: { labels: months, datasets: [{ label:'人均日处理件数', data: effData, borderColor:'#3b82f6', backgroundColor:'#3b82f6', tension:0.3, fill:false }] },
      options: { responsive:true, scales:{y:{beginAtZero:true}} }
    });
    if (window.pfChart) window.pfChart.destroy();
    window.pfChart = safeChart(document.getElementById('trendChart'), {
      type: 'bar',
      data: { labels: months, datasets: [
        { label:'收入', data: revData, backgroundColor:'#10b981' },
        { label:'支出', data: expData, backgroundColor:'#ef4444' }
      ] },
      options: { responsive:true }
    });
  }, 100);
}

function adminLogistics() {
  document.getElementById('admin-title').textContent = '物流状况总览';
  const nowMonth = today().slice(0,7);
  const month = window.dashMonth || nowMonth;
  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="margin:0">${month} 物流统计</h3>
      <input type="month" value="${month}" onchange="window.dashMonth=this.value;adminLogistics()" style="width:160px">
    </div>
  </div>`;

  const shipRows = db.shipments.filter(r => (r.date||'').slice(0,7) === month);
  const freightByBatch = {};
  shipRows.forEach(r => { if (r.freight) freightByBatch[r.batchNo] = +r.freight||0; });

  // 1. 按商品属性汇总
  const attrMap2 = {};
  shipRows.forEach(r => {
    const a = r.attr || '普通货';
    if (!attrMap2[a]) attrMap2[a] = {boxes:0, items:0, weight:0, vol:0, freight:0};
    attrMap2[a].boxes++;
    attrMap2[a].items += +r.items||0;
    attrMap2[a].weight += +r.weight||0;
    attrMap2[a].vol += +r.volume||0;
  });
  const totalW = shipRows.reduce((s,r)=>s+(+r.weight||0),0);
  shipRows.forEach(r => {
    const a = r.attr || '普通货';
    const f = freightByBatch[r.batchNo] || 0;
    const w = +r.weight||0;
    attrMap2[a].freight += f * (totalW > 0 ? w/totalW : 0);
  });

  html += '<div class="card"><h3>按商品属性</h3><div class="table-wrap"><table><thead><tr><th>属性</th><th>箱数</th><th>件数</th><th>重量(kg)</th><th>体积(CBM)</th><th>运费(元)</th><th>平均每件运费</th></tr></thead><tbody>';
  let tBoxes=0,tItems=0,tW=0,tV=0,tF=0;
  Object.entries(attrMap2).forEach(([a,d]) => {
    tBoxes+=d.boxes; tItems+=d.items; tW+=d.weight; tV+=d.vol; tF+=d.freight;
    const perItem = d.items>0 ? (d.freight/d.items).toFixed(2) : '-';
    html += `<tr><td>${a}</td><td>${d.boxes}</td><td>${d.items}</td><td>${d.weight.toFixed(2)}</td><td>${d.vol.toFixed(4)}</td><td>¥${d.freight.toFixed(2)}</td><td>¥${perItem}</td></tr>`;
  });
  const tPerItem = tItems>0 ? (tF/tItems).toFixed(2) : '-';
  const tPerKg = tW>0 ? (tF/tW).toFixed(2) : '-';
  html += `<tr style="font-weight:700;background:#f8fafc"><td>合计</td><td>${tBoxes}</td><td>${tItems}</td><td>${tW.toFixed(2)}</td><td>${tV.toFixed(4)}</td><td>¥${tF.toFixed(2)}</td><td>¥${tPerItem}</td></tr>`;
  html += `</tbody></table></div><p style="margin:8px 0;color:var(--text-light)">平均每kg运费：¥${tPerKg}</p></div>`;

  // 2. 按物流公司
  const logMap = {};
  shipRows.forEach(r => {
    const l = r.logistics || '未知';
    if (!logMap[l]) logMap[l] = {boxes:0, items:0, weight:0, vol:0, freight:0};
    logMap[l].boxes++;
    logMap[l].items += +r.items||0;
    logMap[l].weight += +r.weight||0;
    logMap[l].vol += +r.volume||0;
  });
  Object.keys(freightByBatch).forEach(bn => {
    const batchRows = shipRows.filter(r => r.batchNo === bn);
    const log = batchRows[0] ? batchRows[0].logistics : '未知';
    if (logMap[log]) logMap[log].freight += freightByBatch[bn];
  });
  html += '<div class="card"><h3>按物流公司</h3><div class="table-wrap"><table><thead><tr><th>物流公司</th><th>箱数</th><th>件数</th><th>重量(kg)</th><th>体积(CBM)</th><th>运费(元)</th><th>平均每件</th><th>平均每kg</th></tr></thead><tbody>';
  Object.entries(logMap).sort((a,b)=>b[1].freight-a[1].freight).forEach(([l,d]) => {
    const pi = d.items>0 ? (d.freight/d.items).toFixed(2) : '-';
    const pk = d.weight>0 ? (d.freight/d.weight).toFixed(2) : '-';
    html += `<tr><td>${l}</td><td>${d.boxes}</td><td>${d.items}</td><td>${d.weight.toFixed(2)}</td><td>${d.vol.toFixed(4)}</td><td>¥${d.freight.toFixed(2)}</td><td>¥${pi}</td><td>¥${pk}</td></tr>`;
  });
  html += '</tbody></table></div></div>';

  // 3. 月度物流成本趋势
  const months6 = [];
  const nowD = new Date();
  for (let i=5;i>=0;i--) {
    const d = new Date(nowD.getFullYear(), nowD.getMonth()-i, 1);
    months6.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const monthFreight = months6.map(m => {
    const rows = db.shipments.filter(r => (r.date||'').startsWith(m));
    const fMap = {};
    rows.forEach(r => { if (r.freight) fMap[r.batchNo] = +r.freight||0; });
    return Object.values(fMap).reduce((s,v)=>s+v,0);
  });
  html += '<div class="card"><h3>月度物流成本趋势</h3><canvas id="shipTrendChart" height="80"></canvas></div>';

  // 4. 按物流公司统计破损丢失
  const lossByLog = {};
  (db.arrivals||[]).forEach(r => {
    const l = r.logistics || '未知';
    if (!lossByLog[l]) lossByLog[l] = {lostQty:0, lostVal:0, damQty:0, damVal:0};
    lossByLog[l].lostQty += +r.lostQty||0;
    lossByLog[l].lostVal += +r.lostValue||0;
    lossByLog[l].damQty += +r.damagedQty||0;
    lossByLog[l].damVal += +r.damagedValue||0;
  });
  html += '<div class="card"><h3>各物流公司破损/丢失统计（降序）</h3><div class="table-wrap"><table><thead><tr><th>物流公司</th><th>丢件数</th><th>丢件金额</th><th>破损数</th><th>破损金额</th><th>合计损失</th></tr></thead><tbody>';
  Object.entries(lossByLog).map(([l,d]) => [l,d,d.lostVal+d.damVal]).sort((a,b)=>b[2]-a[2]).forEach(([l,d,tot]) => {
    html += `<tr><td>${l}</td><td>${d.lostQty}</td><td>¥${d.lostVal.toFixed(2)}</td><td>${d.damQty}</td><td>¥${d.damVal.toFixed(2)}</td><td style="font-weight:700">¥${tot.toFixed(2)}</td></tr>`;
  });
  if (Object.keys(lossByLog).length === 0) html += '<tr><td colspan="6" style="color:var(--text-light)">暂无数据</td></tr>';
  html += '</tbody></table></div></div>';

  // 5. 物流公司时效统计
  const shipByBarcode = {};
  (db.shipments||[]).forEach(s => { shipByBarcode[s.barcode] = s; });
  const transitMap = {};
  (db.arrivals||[]).forEach(a => {
    const s = shipByBarcode[a.barcode];
    if (!s || !a.date || !s.date) return;
    const days = Math.round((new Date(a.date) - new Date(s.date)) / 86400000);
    if (days < 0) return;
    const log = a.logistics || '未知';
    const attr = s.attr || '普通货';
    if (!transitMap[log]) transitMap[log] = {totalDays:0, count:0, byAttr:{}};
    transitMap[log].totalDays += days;
    transitMap[log].count++;
    if (!transitMap[log].byAttr[attr]) transitMap[log].byAttr[attr] = {totalDays:0, count:0};
    transitMap[log].byAttr[attr].totalDays += days;
    transitMap[log].byAttr[attr].count++;
  });
  html += '<div class="card"><h3>物流公司平均时效</h3><div class="table-wrap"><table><thead><tr><th>物流公司</th><th>总平均(天)</th><th>参考箱数</th></tr></thead><tbody>';
  Object.entries(transitMap).sort((a,b)=>a[1].totalDays/a[1].count - b[1].totalDays/b[1].count).forEach(([l,d]) => {
    const avg = (d.totalDays/d.count).toFixed(1);
    html += `<tr><td>${l}</td><td style="font-weight:700">${avg} 天</td><td>${d.count}</td></tr>`;
  });
  if (Object.keys(transitMap).length === 0) html += '<tr><td colspan="3" style="color:var(--text-light)">暂无到货数据</td></tr>';
  html += '</tbody></table></div></div>';

  html += '<div class="card"><h3>各物流公司不同商品属性时效</h3><div class="table-wrap"><table><thead><tr><th>物流公司</th><th>商品属性</th><th>平均时效(天)</th><th>参考箱数</th></tr></thead><tbody>';
  Object.entries(transitMap).forEach(([l,d]) => {
    Object.entries(d.byAttr).forEach(([a,ad]) => {
      html += `<tr><td>${l}</td><td>${a}</td><td style="font-weight:600">${(ad.totalDays/ad.count).toFixed(1)} 天</td><td>${ad.count}</td></tr>`;
    });
  });
  if (Object.keys(transitMap).length === 0) html += '<tr><td colspan="4" style="color:var(--text-light)">暂无数据</td></tr>';
  html += '</tbody></table></div></div>';

  document.getElementById('admin-content').innerHTML = html;

  setTimeout(() => {
    if (window.shipTrendChart) window.shipTrendChart.destroy();
    window.shipTrendChart = safeChart(document.getElementById('shipTrendChart'), {
      type: 'bar',
      data: { labels: months6, datasets: [{ label:'物流运费(元)', data: monthFreight, backgroundColor:'#8b5cf6' }] },
      options: { responsive:true, scales:{y:{beginAtZero:true}} }
    });
  }, 100);
}

function adminUsers() {

function addUser() {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<div class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center">
    <div class="card" style="width:400px">
    <h3>新增员工账号</h3>
    <div class="form-group" style="margin-bottom:10px"><label>账号（用户名）</label><input id="new-username"></div>

    <button class="btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">取消</button></div>

async function saveNewUser() {
  const username = document.getElementById('new-username').value.trim();
  const name = document.getElementById('new-name').value.trim();
  const password = document.getElementById('new-password').value.trim();
  if (!username || !password) { toast('账号和密码不能为空', true); return; }
  if (db.users.find(u => u.username === username)) { toast('账号已存在', true); return; }
  await saveRow('users', { username, password, name: name||username, role: 'staff' });
  toast('员工账号已创建');
  document.querySelector('.modal-overlay').remove();
  adminUsers();
}

function editUser(id) {
  const u = db.users.find(x => x.id === id);
  if (!u) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<div class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center">
    <div class="card" style="width:400px">
    <h3>修改密码 - ${u.name}</h3>
    <div class="form-group" style="margin-bottom:10px"><label>新密码</label><input id="edit-password" type="text"></div>
    <div class="form-actions"><button class="btn-primary" onclick="savePwd(${id})">保存</button>
    <button class="btn-secondary" onclick="document.querySelector('.modal-overlay').remove()">取消</button></div>
    </div></div>`;
  document.body.appendChild(wrapper);
}

async function savePwd(id) {
  const pwd = document.getElementById('edit-password').value.trim();
  if (!pwd) { toast('密码不能为空', true); return; }
  const u = db.users.find(x => x.id === id);
  await updateRow('users', id, {password: pwd});
  toast('密码已修改');
  document.querySelector('.modal-overlay').remove();
}

async function delUser(id) {
  if (!confirm('确认删除该员工账号？')) return;
  await deleteRow('users', id);
  toast('账号已删除');
  adminUsers();
}

    </div>`;
  });
  document.getElementById('admin-content').innerHTML = html;
  renderAllOptionLists();
}

function renderAllOptionLists() {
  renderOptionList('countries','countryList');
  renderOptionList('productAttrs','attrList');
  renderOptionList('tempExpenseCategories','tempCatList');
  renderOptionList('costCategories','costCatList');
  renderOptionList('problemTypes','probTypeList');
  renderOptionList('solutionTypes','solTypeList');
  renderOptionList('responsibleTypes','respTypeList');
}

function renderOptionList(dbKey, listId) {
  const list = document.getElementById(listId);
  if (!list) return;
  let html = '<div class="table-wrap"><table><tbody>';
  db[dbKey].forEach((item, i) => {
    html += `<tr><td style="width:40px">${i+1}</td><td id="${listId}_name_${i}">${item}</td><td style="text-align:right;white-space:nowrap">
      <button class="btn-secondary btn-sm" onclick="editOption('${dbKey}',${i},'${listId}')">编辑</button>
      <button class="btn-danger btn-sm" onclick="delOption('${dbKey}',${i})">删除</button>
    </td></tr>`;
  });
  html += '</tbody></table></div>';
  list.innerHTML = html;
}

function editOption(dbKey, idx, listId) {
  const nameTd = document.getElementById(listId + '_name_' + idx);
  const oldVal = db[dbKey][idx];
  nameTd.innerHTML = `<input type="text" id="${listId}_edit_${idx}" value="${oldVal}" style="width:200px" onkeydown="if(event.key==='Enter')saveOptionEdit('${dbKey}',${idx},'${listId}')">`;
  const input = document.getElementById(listId + '_edit_' + idx);
  input.focus();
  input.select();
}

async function saveOptionEdit(dbKey, idx, listId) {
  const input = document.getElementById(listId + '_edit_' + idx);
  const newVal = input.value.trim();
  if (!newVal) { toast('名称不能为空', true); return; }
  if (db[dbKey].includes(newVal) && newVal !== db[dbKey][idx]) { toast('该名称已存在', true); return; }
  db[dbKey][idx] = newVal;
  await saveOption(dbKey, db[dbKey]);
  toast('已修改');
  renderAllOptionLists();
}

async function addOption(dbKey, inputId, listId) {
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if (!val) { toast('请输入选项名称', true); return; }
  if (db[dbKey].includes(val)) { toast('该选项已存在', true); return; }
  db[dbKey].push(val);
  await saveOption(dbKey, db[dbKey]);
  input.value = '';
  toast('已添加');
  renderOptionList(dbKey, listId);
}

async function delOption(dbKey, idx) {
  if (!confirm('确认删除「' + db[dbKey][idx] + '」？已有数据不受影响。')) return;
  db[dbKey].splice(idx, 1);
  await saveOption(dbKey, db[dbKey]);
  toast('已删除');
  renderAllOptionLists();
}

        <button class="btn-secondary btn-sm" onclick="exportCSV('problems','问题件')">问题件CSV</button>
        <button class="btn-secondary btn-sm" onclick="exportCSV('losses','仓库丢失')">丢失CSV</button>
        <button class="btn-secondary btn-sm" onclick="exportCSV('arrivals','国际到货')">到货CSV</button>

function exportAll() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'eric-warehouse-backup-' + today() + '.json';
  a.click();
  toast('数据已导出');
}

function importAll() {
  const file = document.getElementById('importFile').files[0];
  if (!file) { toast('请先选择文件', true); return; }
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.users || !data.workload) { toast('文件格式不正确', true); return; }
      if (!confirm('导入将覆盖当前所有数据，确认继续？')) return;
      // 批量导入到Supabase
      for (const t of TABLES) {
        if (data[t] && data[t].length) {
          try { await sb.from(t).upsert(data[t]); } catch(e) {}
        }
      }
      await loadDB();
      toast('数据导入成功');
      route();
    } catch(err) { toast('文件解析失败', true); }
  };
  reader.readAsText(file);
}

function exportCSV(store, name) {
  const records = db[store] || [];
  if (records.length === 0) { toast('暂无数据可导出', true); return; }
  const keys = Object.keys(records[0]);
  let csv = keys.join(',') + '\n';
  records.forEach(r => {
    csv += keys.map(k => `"${(r[k]??'').toString().replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '-' + today() + '.csv';
  a.click();
  toast('CSV已导出');
}
